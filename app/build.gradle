apply plugin: 'com.android.application'

android {
    namespace 'com.whalepet'
    compileSdk 36

    defaultConfig {
        applicationId "com.whalepet"
        minSdk 24
        targetSdk 36
        // 版本号取本分支（fork）的 20 / 0.9.7：本分支在 3428a2b 已升到 18 / 0.9.5，
        // 上游 29 个提交里的最新版本号是 17 / 0.9.0，两者只是序号不是功能，取较大者不回退任何功能。
        versionCode 20
        versionName "0.9.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}
